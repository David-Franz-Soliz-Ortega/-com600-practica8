name: CI 
on: 
  push: 
  pull_request: 

jobs: 
  # --- PRIMER JOB: PRUEBAS ---dd
  pruebas: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
      
      - name: Preparar Node.js
        uses: actions/setup-node@v4 
        with: 
          node-version: "18" 
          cache: npm 
          
      - name: Instalar dependencias 
        run: npm install 
        
      - name: Ejecutar la suite de pruebas con cobertura
        run: npm run test:cov 
        
      - name: Publicar el reporte como artefacto 
        if: always() 
        uses: actions/upload-artifact@v4 
        with: 
          name: cobertura-${{ github.sha }} 
          path: coverage/ 
          retention-days: 7

  # --- SEGUNDO JOB: CALIDAD ---
  calidad: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
      
      - uses: actions/setup-node@v4 
        with: 
          node-version: "20" 
          cache: npm 
          
      - run: npm install 
      
      - name: Análisis estático 
        run: npx eslint src test --max-warnings 0 
        
      - name: Escaneo de dependencias 
        run: npm audit --audit-level=critical

  # --- TERCER JOB: CREAR IMAGEN DOCKER ---
  imagen: 
    needs: [pruebas, calidad] 
    runs-on: ubuntu-latest 
    permissions: 
      contents: read 
      packages: write 
    steps: 
      - uses: actions/checkout@v4 
      
      - name: Iniciar sesión en el registro 
        uses: docker/login-action@v3 
        with: 
          registry: ghcr.io 
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 
          
      - name: Construir y publicar la imagen 
        uses: docker/build-push-action@v6 
        with: 
          context: . 
          push: true 
          tags: | 
            ghcr.io/${{ github.repository }}:${{ github.sha }} 
            ghcr.io/${{ github.repository }}:1.0.0