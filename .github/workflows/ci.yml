
name: CI 
on: 
  push: 
  pull_request: 

jobs: 
  pruebas: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
      
      - name: Preparar Node.js 24 
        uses: actions/setup-node@v4 
        with: 
          node-version: "24" 
          cache: npm
          
      - name: Instalar dependencias 
        run: npm ci 
        
      - name: Ejecutar la suite de pruebas con cobertura
        run: npm run test:cov 
        
      - name: Publicar el reporte como artefacto 
        if: always() 
        uses: actions/upload-artifact@v4 
        with: 
          name: cobertura-${{ github.sha }} 
          path: coverage/ 
          retention-days: 7