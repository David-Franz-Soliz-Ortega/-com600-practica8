name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Preparar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar la suite de pruebas
        run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Generar el reporte de cobertura
        run: npm run test:cov

      - name: Publicar el reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.node }}-${{ github.sha }}
          path: coverage/
          retention-days: 7

  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático
        run: npx eslint src test --max-warnings 0

      - name: Escaneo de dependencias
        run: npm audit --audit-level=critical

  imagen:
    needs: [pruebas, calidad]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en el registro (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/david-franz-soliz-ortega/com600-practica8:1.0.0
            ghcr.io/david-franz-soliz-ortega/com600-practica8:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/david-franz-soliz-ortega/com600-practica8:latest' || '' }}
